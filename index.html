    <script>
      // Compatibility shim for browser extensions/testing harnesses that assign window.fetch
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' ? window.fetch : null;
          var currentFetch = origFetch ? origFetch.bind(window) : origFetch;
          var desc = {
            get: function() {
              return currentFetch;
            },
            set: function(v) {
              currentFetch = v;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (_) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (_) {}
          }
        } catch (_) {}
      })();
